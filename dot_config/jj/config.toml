[user]
name = "Sean McKenna"
email = "mckennapsean@gmail.com"

[[--scope]]
--when.repositories = ["~/lucid"]
[--scope.user]
email = "seanm@lucidchart.com"

[ui]
default-command = "log"
editor = "hx"
diff-formatter = "delta"

[merge-tools]
delta.diff-expected-exit-codes = [0, 1]

[revset-aliases]
"changes()" = "mine() & mutable()"
"closest_merge(to)" = "heads(::to & merges())"

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"
"format_short_signature(signature)" = "signature.email().local()"

[aliases]
tug = ["bookmark", "advance", "--to", "@-"]
get = ["git", "fetch", "--branch"]
# create a combined merge of all other non-empty changes
megamerge = ["new", "heads(changes() & ~empty() & ~::trunk())"]
# move <revset>, parallelized before the megamerge
spread = ["rebase", "--after", "trunk()", "--before", "closest_merge(@)", "--revision"]
# split off the whole stack to before megamerge
stack = ["spread", "closest_merge(@)+:: ~empty()"]
# rebase your mutable changes onto trunk
restack = ["rebase", "--onto", "trunk()", "--source", "roots(trunk()..) & mutable()", "--simplify-parents", "--skip-emptied"]
sync = ["util", "exec", "--", "bash", "-c", """
  set -e
  branch_name=$(jj bookmark list -r 'trunk()' --template 'name ++ "\n"' | head -n 1)
  jj get $branch_name
  jj bookmark move $branch_name --to ${branch_name}@origin
  jj restack
  # Loop through bookmarks sitting on the trunk now (likely these got squash-merged).
  for b in $(jj bookmark list -r '::trunk()' --template 'name ++ "\n"'); do
    # Forget the bookmark as long as it isn't our actual main branch
    if [ "$b" != "$branch_name" ]; then
      echo "Cleaning up orphaned bookmark: $b"
      jj bookmark forget "$b"
    fi
  done
  jj log
"""]

